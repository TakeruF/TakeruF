# Generates the contribution "snake" animation and publishes it to the `output` branch.
# No extra secrets required — uses the built-in GITHUB_TOKEN.
name: Generate Snake Animation

on:
  # Refresh on a schedule (every 12 hours)
  schedule:
    - cron: "0 */12 * * *"
  # Allow manual runs from the Actions tab (use this the first time)
  workflow_dispatch:
  # Regenerate whenever you push to the default branch
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Produces a dark variant, a light variant, and a colored GIF
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
            dist/snake.gif?color_snake=#818cf8&color_dots=#0d1b3a,#312e81,#6366f1,#818cf8,#c084fc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
