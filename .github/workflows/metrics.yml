# Generates a metrics image (github-metrics) and commits it to the repo.
#
# REQUIRED SECRET:
#   METRICS_TOKEN — a GitHub Personal Access Token (classic) with the `repo`
#   scope (and `read:user`). The default GITHUB_TOKEN works for public stats,
#   but a PAT is recommended so private contributions and richer plugins render.
#
#   How to add it:
#     1. github.com → Settings → Developer settings → Personal access tokens
#        → Tokens (classic) → Generate new token → scopes: repo, read:user.
#     2. This repo → Settings → Secrets and variables → Actions → New repository
#        secret → Name: METRICS_TOKEN → paste the token.
#
#   If METRICS_TOKEN is not set, the workflow falls back to GITHUB_TOKEN, which
#   still produces a basic metrics image. No secret is ever printed in logs.
name: Generate Metrics

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate metrics image
        uses: lowlighter/metrics@latest
        with:
          # Falls back to the built-in GITHUB_TOKEN if METRICS_TOKEN is absent.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Tokyo
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          committer_branch: main
