<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Takeru Universe banner">
  <defs>
    <!-- Deep space background gradient -->
    <radialGradient id="space" cx="78%" cy="22%" r="95%">
      <stop offset="0%" stop-color="#0d1b3a"/>
      <stop offset="45%" stop-color="#070b1c"/>
      <stop offset="100%" stop-color="#02030a"/>
    </radialGradient>
    <!-- Accent glow gradient for text + ring -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="55%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="planet" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#312e81"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#space)"/>

  <!-- Subtle perspective grid (futuristic horizon) -->
  <g stroke="url(#grid)" stroke-width="1" opacity="0.5">
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="278" x2="1200" y2="278"/>
    <line x1="0" y1="306" x2="1200" y2="306"/>
    <line x1="200" y1="240" x2="60" y2="320"/>
    <line x1="400" y1="240" x2="340" y2="320"/>
    <line x1="600" y1="240" x2="600" y2="320"/>
    <line x1="800" y1="240" x2="860" y2="320"/>
    <line x1="1000" y1="240" x2="1140" y2="320"/>
  </g>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="90" cy="60" r="1.4" opacity="0.9"/>
    <circle cx="160" cy="120" r="1" opacity="0.6"/>
    <circle cx="240" cy="50" r="1.2" opacity="0.8"/>
    <circle cx="320" cy="150" r="0.8" opacity="0.5"/>
    <circle cx="430" cy="80" r="1.3" opacity="0.85"/>
    <circle cx="520" cy="40" r="0.9" opacity="0.6"/>
    <circle cx="560" cy="170" r="1.1" opacity="0.7"/>
    <circle cx="700" cy="60" r="1" opacity="0.6"/>
    <circle cx="780" cy="130" r="1.4" opacity="0.9"/>
    <circle cx="880" cy="40" r="0.9" opacity="0.55"/>
    <circle cx="960" cy="150" r="1.2" opacity="0.8"/>
    <circle cx="1040" cy="70" r="1" opacity="0.6"/>
    <circle cx="1120" cy="120" r="1.3" opacity="0.85"/>
    <circle cx="1160" cy="40" r="0.9" opacity="0.6"/>
    <circle cx="380" cy="200" r="0.7" opacity="0.45"/>
    <circle cx="650" cy="210" r="0.8" opacity="0.5"/>
  </g>

  <!-- Orbiting planet on the right -->
  <g transform="translate(990 150)" filter="url(#soft)">
    <ellipse cx="0" cy="0" rx="150" ry="44" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.45" transform="rotate(-18)"/>
    <circle cx="0" cy="0" r="60" fill="url(#planet)"/>
    <circle cx="-22" cy="-20" r="10" fill="#c7d2fe" opacity="0.35"/>
    <circle cx="18" cy="14" r="7" fill="#1e1b4b" opacity="0.45"/>
  </g>

  <!-- Small comet -->
  <g opacity="0.8">
    <line x1="120" y1="220" x2="200" y2="190" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <circle cx="200" cy="190" r="3" fill="#e0f2fe"/>
  </g>

  <!-- Text block -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="80" y="135" font-size="60" font-weight="700" fill="url(#accent)" filter="url(#soft)">Takeru Universe</text>
    <text x="82" y="180" font-size="23" font-weight="500" fill="#cbd5e1">Product-building student developer · Tokyo / Waseda</text>
    <text x="82" y="214" font-size="18" font-weight="400" fill="#7c8aa5">Building products that make learning &amp; AI workflows more useful</text>
  </g>
</svg>
